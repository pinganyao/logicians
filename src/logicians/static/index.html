<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Logicians — Live</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>The Logicians — Live</h1>
      <p>Sync with Logic, then improvise melody, drums, and bass over your loop.</p>
    </header>

    <section id="settings-section">
      <h2>Settings</h2>
      <form id="settings-form" class="grid">
        <label>
          MIDI Input
          <select id="midi-input" name="midi_input" required></select>
        </label>
        <label>
          MIDI Output (melody)
          <select id="midi-output" name="midi_output" required></select>
        </label>
        <label>
          Tempo (BPM)
          <input type="number" id="tempo" name="tempo" value="120" min="40" max="300" step="1" required>
        </label>
        <label>
          Bars
          <input type="number" id="bars" name="bars" value="4" min="1" max="32" step="1" required>
        </label>
        <label>
          Key
          <input type="text" id="key" name="key" placeholder="e.g. F, Am, D minor">
        </label>
        <label>
          Density
          <select id="density" name="density">
            <option value="sparse">Sparse</option>
            <option value="medium" selected>Medium</option>
            <option value="busy">Busy</option>
          </select>
        </label>
        <label>
          Time Signature
          <select id="time-signature" name="time_signature">
            <option value="4/4" selected>4/4</option>
            <option value="3/4">3/4</option>
            <option value="6/8">6/8</option>
          </select>
        </label>
        <label>
          <span>&nbsp;</span>
          <label style="flex-direction: row; align-items: center; gap: 0.5rem; color: #e8eaed;">
            <input type="checkbox" id="continuous" name="continuous" checked>
            Continuous improvisation
          </label>
        </label>

        <details class="full">
          <summary>Advanced options</summary>
          <div class="grid">
            <label>
              Drum Output
              <select id="drum-output" name="drum_output"></select>
            </label>
            <label>
              Drum Channel (0-indexed)
              <input type="number" id="drum-channel" name="drum_channel" value="1" min="0" max="15">
            </label>
            <label>
              Drum Variation
              <input type="number" id="drum-variation" name="drum_variation" value="0.3" min="0" max="1" step="0.05">
            </label>
            <label>
              Drum Style
              <select id="drum-style" name="drum_style">
                <option value="">Vary captured groove</option>
              </select>
            </label>
            <label>
              Bass Output
              <select id="bass-output" name="bass_output"></select>
            </label>
            <label>
              Bass Channel (0-indexed)
              <input type="number" id="bass-channel" name="bass_channel" value="2" min="0" max="15">
            </label>
            <label>
              Seed
              <input type="number" id="seed" name="seed" placeholder="Random">
            </label>
            <label>
              Playback Loop
              <input type="number" id="playback-loop" name="playback_loop" value="3" min="1" max="20">
            </label>
            <label>
              Count-in Loops
              <input type="number" id="count-in" name="count_in" value="0" min="0" max="10">
            </label>
          </div>
        </details>
      </form>
    </section>

    <section id="status-section">
      <h2>Status</h2>
      <div class="status-line">
        State: <span class="state" id="status-state">idle</span>
        <span id="status-position"></span>
      </div>
      <div class="status-detail" id="status-key" hidden>
        Key: <strong id="key-label"></strong>
      </div>
      <div class="chords" id="status-chords" hidden></div>
      <div class="message" id="status-message" hidden></div>
      <div class="error" id="status-error" hidden></div>
      <div class="error" id="status-warning" hidden></div>
    </section>

    <div class="actions">
      <button type="button" id="btn-start">Start Session</button>
      <button type="button" id="btn-improvise" disabled>Improvise</button>
      <button type="button" id="btn-stop" disabled>Stop</button>
      <button type="button" id="btn-reset" disabled>Reset</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
